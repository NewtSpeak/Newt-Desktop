# Cargo artifacts default to src-tauri/target, which sits inside the Vite project
# root. On Windows, `bun run tauri dev` runs Vite + a React Router child compiler
# that file-watches the project; Cargo locks *.dll under target/ during link and
# chokidar hits EBUSY, killing beforeDevCommand.
#
# Keep build output outside Newt-Desktop so Vite never sees those files.
#
# Android NDK ld.lld on Windows cannot open paths with non-ASCII characters
# (e.g. D:\研发\...). Use a pure-ASCII absolute target-dir on D:\.
# Override with env CARGO_TARGET_DIR if you need a different location.
[build]
target-dir = "D:/tauri-target/newt-desktop"
