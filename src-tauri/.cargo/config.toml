# Cargo artifacts default to src-tauri/target, which sits inside the Vite project
# root. On Windows, `bun run tauri dev` runs Vite + a React Router child compiler
# that file-watches the project; Cargo locks *.dll under target/ during link and
# chokidar hits EBUSY, killing beforeDevCommand.
#
# Keep build output outside Owl-Desktop so Vite never sees those files.
# Path is relative to this config file's directory (src-tauri/.cargo/).
[build]
target-dir = "../../../.tauri-target/owl-desktop"
